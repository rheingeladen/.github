<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RHEINGELADEN">
  <!--
    Dasselbe Zeichen wie apps/web/src/app/icon.svg — der Pegel: ein Bildschirm,
    in dem das Wasser steht.

    Ein Unterschied, und der ist absichtlich: Hier fehlt der Eckenradius des
    Favicons. GitHub maskiert Organisationsbilder selbst. Ein zweiter Radius
    darunter ergäbe helle Zwickel in den Ecken, sobald das Bild auf dunklem
    Grund steht. Wer das Zeichen ändert, ändert beide Dateien.
  -->
  <rect width="64" height="64" fill="#1f3855" />
  <clipPath id="schirm"><rect x="10" y="12" width="44" height="34" rx="2" /></clipPath>
  <rect x="10" y="12" width="44" height="34" rx="2" fill="#e7ebda" />
  <g clip-path="url(#schirm)">
    <path d="M 6 30 C 16 26 26 33 36 30 C 46 27 52 31 58 30 L 58 50 L 6 50 Z" fill="#4fa8bd" />
    <path d="M 6 38 C 18 35 26 41 38 38 C 48 35.5 54 38 58 37 L 58 50 L 6 50 Z" fill="#2d6d8a" />
    <path d="M 6 30 C 16 26 26 33 36 30 C 46 27 52 31 58 30" fill="none" stroke="#f7ba0b" stroke-width="4" />
  </g>
  <rect x="10" y="12" width="44" height="34" rx="2" fill="none" stroke="#1f3855" stroke-width="4" />
</svg>
